apiVersion: apps/v1
kind: Deployment
metadata:
  name: olykube-api-deployment
  labels:
    app: olykube-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: olykube-api
  template:
    metadata:
      labels:
        app: olykube-api
    spec:
      # K8s her Service için REDIS_PORT=tcp://... gibi değişkenler ekler; bu, uygulamanın
      # REDIS_PORT ayarıyla çakışır. Servislere zaten DNS adlarıyla (redis, db, chromadb) ulaşılıyor.
      enableServiceLinks: false
      containers:
      - name: olykube-container
        image: olykube-api:v5
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: olykube-env
---
apiVersion: v1
kind: Service
metadata:
  name: olykube-api-service
spec:
  selector:
    app: olykube-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
